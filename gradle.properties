org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Per-version keys (minecraft_version, loader_version, fabric_version, papi_version) live in
# versions/<v>/gradle.properties.
loom_version=1.17.17
kotlin_version=2.4.10
fabric_kotlin_version=1.13.13+kotlin.2.4.10
keval_version=1.1.1
java_version=25

mod_version=1.2.1
maven_group=mhl.papiexpr
archives_base_name=placeholder-api-expr
# GitHub Packages a local `./gradlew publish` targets; CI uses its own GITHUB_REPOSITORY.
publish_repository=RainbowKittyClub/text-placeholder-api-expr

# Multi-version build: one node per version under versions/.
stonecutter_version=0.9.8
stonecutter_versions=26.2,26.3
stonecutter_vcs_version=26.2
dev.kikugie.stonecutter.hard_mode=true
